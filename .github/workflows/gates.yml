name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compiled context reproducible (B1)
        run: python3 scripts/gen-context.py --check

      - name: Structural validation (C0)
        run: python3 scripts/validate-bootstrap.py --check-context

      - name: Records append-only — self-test (gate can fail)
        run: python3 scripts/check-records-append-only.py --self-test

      - name: Records append-only
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            git cat-file -e "$BASE" 2>/dev/null || BASE="HEAD~1"
          fi
          python3 scripts/check-records-append-only.py --base "$BASE"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Surface resolver vectors (SCMS-008 · SSS S0/S1 slice + S2 access property)
        run: node --test test/resolver.test.ts
        working-directory: impl/surface-resolver

      - name: Canon vectors (SCMS-011 · envelope, identity, append-only, spine)
        run: node --test test/canon.test.ts
        working-directory: impl/canon

      - name: Contract vectors (SCMS-012 · governed writes, receipts, conflict)
        run: node --test test/contracts.test.ts
        working-directory: impl/contracts

      - name: Qualification vectors (SCMS-013 · qualify/promote gates)
        run: node --test test/qualification.test.ts
        working-directory: impl/qualification

      - name: Projection cache vectors (SCMS-014 · fingerprint-scoped invalidation)
        run: node --test test/cache.test.ts
        working-directory: impl/projection-cache

      - name: Schema vectors (SCMS-016 · Article type, Home composition)
        run: node --test test/schema.test.ts
        working-directory: impl/schema

      - name: Observation vectors (SCMS-017 · consistency, chips, presence)
        run: node --test test/observation.test.ts
        working-directory: impl/observation

      - name: Cross-expression S3 vectors (SCMS-009)
        run: node --test test/s3.test.ts
        working-directory: impl/surface-expression

      - name: Projection sync — self-test (gate can fail)
        run: python3 scripts/check-projection-sync.py --self-test

      - name: Projection sync (main only — a design-change PR legitimately drifts until republish)
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/check-projection-sync.py
