    notes: "Admission policy, cardinality, importance, required operations — imported unchanged."
  - local: "Page type"
    source: "ses"
    imported: "Composition"
    relation: "exact"
    authority: "/Users/zachshallbetter/Projects/_Protocols/semantic-expression-system/docs/SES-SPECIFICATION.md"
