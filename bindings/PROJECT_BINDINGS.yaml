    imported: "Qualification tuple, evidence result/validity enums, radius R1-R4, required-evidence equation, promotion boundary"
    relation: "exact"
    authority: "/Users/zachshallbetter/Projects/_Protocols/evidence-qualification-protocol"
    compatibility_effect: "none"
    notes: "Consequence profiles (note|article|commitment) are scms-local qualification profiles, declared per EQP profile semantics."
  - local: "Consistency state"
