    source: "rr-rsp"
    imported: "DescriptorEnvelope"
    relation: "extended"
    authority: "/Users/zachshallbetter/Projects/reflective-rust/crates/reflective-rust-protocol/src/lib.rs"
    compatibility_effect: "none"
    notes: "Body kinds extended to Schema|Content|Relation|Observation|Topology; envelope fields and validation rules imported unchanged."
