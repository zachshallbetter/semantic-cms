project:
  id: "scms"
  name: "Semantic CMS"

# Owner directive, 2026-08-28 (canonical statement: DESIGN.md §12.1; also
# PROJECT_INTENT.md constraints and FORMAL_RESOURCE_MANIFEST.json integrityPolicy):
# the system is built in isolation; every binding below imports from a PINNED
# dependency. Repair is upstream-first — fix the owning project, re-pin here.
# Local modification of consumed code or specs is prohibited; unavoidable
# divergence is a typed deviation in the `deviations:` list below, with the
# upstream fix landing as its reversal trigger.

# Local vocabulary is bound to its source concepts; DESIGN.md §15 is the prose
# form of this table. A binding imports meaning — it never enlarges the
# authority of the imported protocol.
concept_bindings:
  - local: "Envelope"
    source: "rr-rsp"
    imported: "DescriptorEnvelope"
    relation: "extended"
    authority: "/Users/zachshallbetter/Projects/reflective-rust/crates/reflective-rust-protocol/src/lib.rs"
    compatibility_effect: "none"
    notes: "Body kinds extended to Schema|Content|Relation|Observation|Topology; envelope fields and validation rules imported unchanged."
  - local: "Provenance class"
    source: "rr-rsp"
    imported: "ProjectionKind (compiler-certified|declared|derived|observed)"
    relation: "constrained"
    authority: "/Users/zachshallbetter/Projects/reflective-rust/docs/04-runtime/descriptor-protocol.md"
    compatibility_effect: "semantic-change"
    notes: "compiler-certified renamed system-certified (an identified trusted pipeline, not a compiler). No-promotion rule imported verbatim."
  - local: "Field (content field)"
    source: "ses"
    imported: "Slot"
    relation: "exact"
    authority: "/Users/zachshallbetter/Projects/_Protocols/semantic-expression-system/docs/SES-SPECIFICATION.md"
    compatibility_effect: "none"
    notes: ""
  - local: "Content component"
