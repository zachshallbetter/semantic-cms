project:
  id: "scms"
  name: "Semantic CMS"

# Owner directive, 2026-08-28 (canonical statement: DESIGN.md §12.1; also
# PROJECT_INTENT.md constraints and FORMAL_RESOURCE_MANIFEST.json integrityPolicy):
# the system is built in isolation; every binding below imports from a PINNED
# dependency. Repair is upstream-first — fix the owning project, re-pin here.
# Local modification of consumed code or specs is prohibited; unavoidable
# divergence is a typed deviation in the `deviations:` list below, with the
# upstream fix landing as its reversal trigger.

# Local vocabulary is bound to its source concepts; DESIGN.md §15 is the prose
# form of this table. A binding imports meaning — it never enlarges the
# authority of the imported protocol.
